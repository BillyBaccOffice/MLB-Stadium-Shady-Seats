// ── SOLAR MATH ──────────────────────────────────────────────
const R=d=>d*Math.PI/180,D=r=>r*180/Math.PI;
function sunPos(year,month,day,localHour,tzOff,lat,lon){
  const uh=localHour-tzOff;
  let h=((uh%24)+24)%24,d=day+(uh<0?-1:uh>=24?1:0);
  let y=year,m=month;if(m<=2){y--;m+=12;}
  const A=Math.floor(y/100),B=2-A+Math.floor(A/4);
  const JD=Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5+h/24;
  const n=JD-2451545;
  const L=((280.46+0.9856474*n)%360+360)%360;
  const g=R(((357.528+0.9856003*n)%360+360)%360);
  const lam=R(L+1.915*Math.sin(g)+0.02*Math.sin(2*g));
  const eps=R(23.439-0.0000004*n);
  const RA=Math.atan2(Math.cos(eps)*Math.sin(lam),Math.cos(lam));
  const dec=Math.asin(Math.sin(eps)*Math.sin(lam));
  const GMST=((6.697375+0.0657098242*n+h)%24+24)%24;
  const LHA=R(((GMST*15+lon-D(RA))%360+360)%360);
  const lr=R(lat);
  const sa=Math.sin(lr)*Math.sin(dec)+Math.cos(lr)*Math.cos(dec)*Math.cos(LHA);
  const alt=D(Math.asin(Math.max(-1,Math.min(1,sa))));
  const az=Math.atan2(-Math.cos(dec)*Math.sin(LHA),Math.sin(dec)*Math.cos(lr)-Math.cos(dec)*Math.cos(LHA)*Math.sin(lr));
  return {alt,az:(D(az)+360)%360};
}
function baseIntensity(sAz,sunAz,sunAlt){
  if(sunAlt<=0)return 0;
  let d=Math.abs(sAz-sunAz);if(d>180)d=360-d;
  return Math.max(0,Math.cos(R(d)))*Math.pow(Math.sin(R(Math.min(sunAlt,90))),0.4);
}
// Overhang shading: lower decks shielded from low-angle sun by upper deck
function deckIntensity(base,level,sunAlt){
  if(level>=2||base<0.08)return base;
  const maxShade=level===0?0.58:0.80;
  const t=Math.pow(Math.sin(R(Math.min(sunAlt,90))),0.6);
  return base*(maxShade+(1-maxShade)*t);
}

// ── COLORS: blue=shade, red=sun ─────────────────────────────
function iColor(i){
  if(i<0.11)return{bg:"#023e8a",bdr:"#0077b6",txt:"#90e0ef",s:"Full Shade"};
  if(i<0.28)return{bg:"#0096c7",bdr:"#00b4d8",txt:"#caf0f8",s:"Great Shade"};
  if(i<0.46)return{bg:"#90e0ef",bdr:"#48cae4",txt:"#023e8a",s:"Partial Shade"};
  if(i<0.62)return{bg:"#ffb3b3",bdr:"#ff8080",txt:"#7d0000",s:"Some Sun"};
  if(i<0.79)return{bg:"#e63946",bdr:"#c1121f",txt:"#fff",s:"Sunny"};
  return           {bg:"#6d0025",bdr:"#9d0208",txt:"#ffb3b3",s:"Direct Sun"};
}

// ── STADIUM SECTION GEOMETRY ─────────────────────────────────
function getStadiumSections(shape){
  const N=36,step=360/N,secs=[];
  if(shape==="dome"){
    for(let i=0;i<N;i++)secs.push({a1:i*step,a2:(i+1)*step,lv:2,r1:95,r2:168});
    return secs;
  }
  if(shape==="fenway"){
    for(let i=0;i<N;i++){
      const mid=(i+0.5)*step;
      if(mid>=238&&mid<=328){
        // LF: Green Monster area — 2 tighter tiers, no upper
        secs.push({a1:i*step,a2:(i+1)*step,lv:0,r1:88,r2:110});
        secs.push({a1:i*step,a2:(i+1)*step,lv:1,r1:113,r2:140});
      } else if(mid>328||mid<55){
        // CF bleachers: single wide tier
        secs.push({a1:i*step,a2:(i+1)*step,lv:0,r1:98,r2:152});
      } else if((mid>=55&&mid<110)||(mid>=208&&mid<238)){
        // RF foul / 3B line: field + grandstand, no upper

        secs.push({a1:i*step,a2:(i+1)*step,lv:2,r1:136,r2:157});
        secs.push({a1:i*step,a2:(i+1)*step,lv:2,r1:160,r2:182});

  if(shape==="wrigley"){

      } else {

  if(shape==="camden"){
    // Camden Yards: warehouse in RF, LF gallery separate, no RF upper
    for(let i=0;i<N;i++){
      const mid=(i+0.5)*step;
      if(mid>=318||mid<=52){
        secs.push({a1:i*step,a2:(i+1)*step,lv:0,r1:96,r2:150});
      } else if(mid>52&&mid<=105){
        secs.push({a1:i*step,a2:(i+1)*step,lv:0,r1:90,r2:120});
        secs.push({a1:i*step,a2:(i+1)*step,lv:1,r1:123,r2:156});
      } else if(mid>105&&mid<=268){
        secs.push({a1:i*step,a2:(i+1)*step,lv:0,r1:88,r2:116});
        secs.push({a1:i*step,a2:(i+1)*step,lv:1,r1:119,r2:148});
        secs.push({a1:i*step,a2:(i+1)*step,lv:2,r1:151,r2:183});
      } else {
        secs.push({a1:i*step,a2:(i+1)*step,lv:0,r1:88,r2:120});
        secs.push({a1:i*step,a2:(i+1)*step,lv:1,r1:123,r2:162});
      }
    }
    return secs;
  }
  if(shape==="comerica"){
    // Comerica Park: RF party decks instead of full upper; compact LF
    for(let i=0;i<N;i++){
      const mid=(i+0.5)*step;
      if(mid>=335||mid<=25){
        secs.push({a1:i*step,a2:(i+1)*step,lv:0,r1:102,r2:156});
      } else if(mid>25&&mid<=90){
        secs.push({a1:i*step,a2:(i+1)*step,lv:0,r1:90,r2:122});
        secs.push({a1:i*step,a2:(i+1)*step,lv:1,r1:125,r2:158});
      } else if(mid>90&&mid<=268){
        secs.push({a1:i*step,a2:(i+1)*step,lv:0,r1:88,r2:116});
        secs.push({a1:i*step,a2:(i+1)*step,lv:1,r1:119,r2:148});
        secs.push({a1:i*step,a2:(i+1)*step,lv:2,r1:151,r2:182});
      } else {
        secs.push({a1:i*step,a2:(i+1)*step,lv:0,r1:90,r2:122});
        secs.push({a1:i*step,a2:(i+1)*step,lv:2,r1:125,r2:165});
      }
    }
    return secs;
  }
  if(shape==="oakland"){
    // Sutter Health Park: small venue, single-level outfield, 2-level infield
    for(let i=0;i<N;i++){
      const mid=(i+0.5)*step;
      if(mid>=340||mid<=20) continue; // CF gap
      if((mid>20&&mid<=80)||(mid>=280&&mid<340)){
        secs.push({a1:i*step,a2:(i+1)*step,lv:0,r1:96,r2:148});

  // STANDARD: 3-ring (upper only in infield)

    } else {
      secs.push({a1:i*step,a2:(i+1)*step,lv:0,r1:100,r2:160});
    }
  }
  return secs;
}

// ── ARC PATH ─────────────────────────────────────────────────
function arc(cx,cy,r1,r2,a1,a2){
  const g=0.5,s=R(a1+g),e=R(a2-g);
  const x1=cx+r1*Math.sin(s),y1=cy-r1*Math.cos(s);
  const x2=cx+r2*Math.sin(s),y2=cy-r2*Math.cos(s);
  const x3=cx+r2*Math.sin(e),y3=cy-r2*Math.cos(e);
  const x4=cx+r1*Math.sin(e),y4=cy-r1*Math.cos(e);
  const lg=(a2-a1)>180?1:0;
  return `M${x1} ${y1}L${x2} ${y2}A${r2} ${r2} 0 ${lg} 1 ${x3} ${y3}L${x4} ${y4}A${r1} ${r1} 0 ${lg} 0 ${x1} ${y1}Z`;
}

// ── DIAGRAM SVG ───────────────────────────────────────────────
function Diagram({park,sun,size=400}){
  const cx=size/2,cy=size/2;
  const isDome=park.roof==="dome";
  const bR=size*0.126;
  const secs=useMemo(()=>getStadiumSections(isDome?"dome":park.shape),[park.shape,isDome]);
  const colored=useMemo(()=>secs.map(sec=>{
    const mid=(sec.a1+sec.a2)/2;
    const caz=((park.cfAz+mid)%360+360)%360;
    const bi=isDome?0:baseIntensity(caz,sun.az,sun.alt);
    return{...sec,color:iColor(deckIntensity(bi,sec.lv,sun.alt))};
  }),[secs,park.cfAz,sun,isDome]);
  const sva=((sun.az-park.cfAz+360)%360);
  const sunAbove=sun.alt>0;
  const sr=size*0.504;
  const sx=cx+sr*Math.sin(R(sva)),sy=cy-sr*Math.cos(R(sva));
  const lbR=size*0.512;
  return(
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{display:"block"}}>
      <defs>
        <radialGradient id="gf" cx="50%" cy="55%" r="50%"><stop offset="0%" stopColor="#16a34a"/><stop offset="100%" stopColor="#15803d"/></radialGradient>
        <radialGradient id="gd" cx="50%" cy="60%" r="50%"><stop offset="0%" stopColor="#d97706"/><stop offset="100%" stopColor="#b45309"/></radialGradient>
        <radialGradient id="bg" cx="50%" cy="50%" r="50%"><stop offset="0%" stopColor="#111827"/><stop offset="100%" stopColor="#0a0f1e"/></radialGradient>
        <filter id="gl"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <circle cx={cx} cy={cy} r={size*0.5} fill="url(#bg)"/>
      {colored.map((s,i)=><path key={i} d={arc(cx,cy,s.r1,s.r2,s.a1,s.a2)} fill={s.color.bg} opacity={0.94} stroke={s.color.bdr} strokeWidth={0.35}/>)}
      <circle cx={cx} cy={cy} r={size*0.218} fill="#b45309" opacity={0.45}/>
      <circle cx={cx} cy={cy} r={size*0.210} fill="url(#gf)"/>
      <circle cx={cx} cy={cy} r={size*0.150} fill="url(#gd)"/>
      <polygon points={`${cx},${cy-bR*0.97} ${cx+bR*0.69},${cy} ${cx},${cy+bR*0.67} ${cx-bR*0.69},${cy}`} fill="#16a34a"/>
      <circle cx={cx} cy={cy} r={bR*0.13} fill="#b45309"/>
      {[[cx,cy-bR],[cx+bR*0.69,cy],[cx-bR*0.69,cy]].map(([bx,by],bi)=>(
        <rect key={bi} x={bx-4} y={by-4} width={8} height={8} fill="white" rx={1} transform={`rotate(45,${bx},${by})`}/>
      ))}
      <polygon points={`${cx},${cy+bR*1.04} ${cx-6},${cy+bR*0.82} ${cx-6},${cy+bR*0.63} ${cx+6},${cy+bR*0.63} ${cx+6},${cy+bR*0.82}`} fill="white"/>
      <line x1={cx} y1={cy+bR} x2={cx+size*0.205*0.73} y2={cy-size*0.205*0.68} stroke="white" strokeWidth={1} strokeOpacity={0.28}/>
      <line x1={cx} y1={cy+bR} x2={cx-size*0.205*0.73} y2={cy-size*0.205*0.68} stroke="white" strokeWidth={1} strokeOpacity={0.28}/>
      {[{a:0,t:"CF"},{a:90,t:"RF"},{a:180,t:"HP"},{a:270,t:"LF"}].map(({a,t})=>(
        <text key={t} x={cx+lbR*Math.sin(R(a))} y={cy-lbR*Math.cos(R(a))} textAnchor="middle" dominantBaseline="middle" fill="#64748b" fontSize={size*0.033} fontWeight="bold" fontFamily="system-ui">{t}</text>
      ))}
      {sunAbove&&(
        <g filter="url(#gl)">
          <circle cx={sx} cy={sy} r={size*0.043} fill="#fbbf24" opacity={0.9}/>
          <circle cx={sx} cy={sy} r={size*0.025} fill="#fef08a"/>
          {[0,45,90,135,180,225,270,315].map(ra=>{
            const a=R(ra),rx1=sx+size*0.056*Math.sin(a),ry1=sy-size*0.056*Math.cos(a);
            const rx2=sx+size*0.068*Math.sin(a),ry2=sy-size*0.068*Math.cos(a);
            return<line key={ra} x1={rx1} y1={ry1} x2={rx2} y2={ry2} stroke="#fbbf24" strokeWidth={2.2} strokeLinecap="round"/>;
          })}
          <line x1={sx-size*0.05*Math.sin(R(sva))} y1={sy+size*0.05*Math.cos(R(sva))}
                x2={cx+192*Math.sin(R(sva))*0.96} y2={cy-192*Math.cos(R(sva))*0.96}
                stroke="#fbbf24" strokeWidth={1.8} strokeOpacity={0.5} strokeDasharray="4 3"/>
          <text x={sx} y={sy+size*0.082} textAnchor="middle" fill="#fbbf24" fontSize={size*0.026} fontFamily="system-ui">{Math.round(sun.alt)}&#176; alt</text>
        </g>
      )}
      {!sunAbove&&<text x={cx} y={cy+size*0.32} textAnchor="middle" fill="#374151" fontSize={size*0.03} fontFamily="system-ui">Night / Roof Closed</text>}
      {isDome&&<><circle cx={cx} cy={cy} r={size*0.5} fill="#0f172a" opacity={0.65}/><text x={cx} y={cy-10} textAnchor="middle" fill="#94a3b8" fontSize={size*0.038} fontFamily="system-ui">Dome Stadium</text><text x={cx} y={cy+14} textAnchor="middle" fill="#64748b" fontSize={size*0.028} fontFamily="system-ui">All seats equally cool</text></>}
    </svg>
  );
}

// ── SEAT RECOMMENDATIONS ──────────────────────────────────────
function Recs({park,sun}){
  if(park.roof==="dome")return(
    <div style={{background:"#022c4a",border:"1px solid #0369a1",borderRadius:12,padding:16,marginTop:12}}>
      <div style={{color:"#38bdf8",fontWeight:600,marginBottom:8}}>Dome / Climate Controlled</div>
      <div style={{color:"#64748b",fontSize:13}}>No sun concerns! All seats equally comfortable. Best views from lower deck sections behind home plate.</div>
    </div>
  );
  const z=ZONES[park.abbr]||DEF;
  const entries=Object.values(z).map(({n,a})=>{
    const caz=((park.cfAz+a)%360+360)%360;
    const bi=baseIntensity(caz,sun.az,sun.alt);
    const intensity=deckIntensity(bi,0,sun.alt);
    return{n,intensity,color:iColor(intensity)};
  }).sort((a,b)=>a.intensity-b.intensity);
  const best=entries.slice(0,3),worst=entries.slice(-2);
  return(
    <div>
      <div style={{background:"#022c4a",border:"1px solid #0369a1",borderRadius:12,padding:14,marginBottom:10}}>
        <div style={{color:"#38bdf8",fontWeight:600,fontSize:14,marginBottom:10}}>Best Seats &#8212; Most Shade</div>

            <div style={{width:14,height:14,borderRadius:4,background:e.color.bg,flexShrink:0,border:`1px solid ${e.color.bdr}`}}/>
            <div>
              <div style={{color:"#e2e8f0",fontSize:13,fontWeight:600}}>{e.n}</div>
              <div style={{color:"#0ea5e9",fontSize:11}}>{e.color.s} &middot; {Math.round(e.intensity*100)}% sun</div>

          </div>

      <div style={{background:"#2d0a0a",border:"1px solid #991b1b",borderRadius:12,padding:14}}>
        <div style={{color:"#f87171",fontWeight:600,fontSize:14,marginBottom:10}}>Avoid &#8212; Direct Sun</div>
        {worst.map((e,i)=>(
          <div key={i} style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
            <div style={{width:14,height:14,borderRadius:4,background:e.color.bg,flexShrink:0,border:`1px solid ${e.color.bdr}`}}/>
            <div>
              <div style={{color:"#e2e8f0",fontSize:13,fontWeight:600}}>{e.n}</div>
              <div style={{color:"#f87171",fontSize:11}}>{e.color.s} &middot; {Math.round(e.intensity*100)}% sun</div>

    </div>
  );

          <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"flex-end"}}>
            <div><div style={{color:"#374151",fontSize:10,marginBottom:4}}>MONTH</div><select value={mo} onChange={e=>{const nm=+e.target.value;setMo(nm);setDy(Math.min(dy,dim(yr,nm)));}} style={sel}>{MN.map((n,i)=><option key={i+1} value={i+1}>{n}</option>)}</select></div>
            <div><div style={{color:"#374151",fontSize:10,marginBottom:4}}>DAY</div><select value={dy} onChange={e=>setDy(+e.target.value)} style={sel}>{Array.from({length:dim(yr,mo)},(_,i)=><option key={i+1} value={i+1}>{i+1}</option>)}</select></div>
            <div><div style={{color:"#374151",fontSize:10,marginBottom:4}}>YEAR</div><select value={yr} onChange={e=>setYr(+e.target.value)} style={sel}>{[2025,2026,2027,2028].map(y=><option key={y} value={y}>{y}</option>)}</select></div>
            <div><div style={{color:"#374151",fontSize:10,marginBottom:4}}>HOUR</div><select value={hr} onChange={e=>setHr(+e.target.value)} style={sel}>{Array.from({length:24},(_,i)=><option key={i} value={i}>{i===0?"12 AM":i<12?`${i} AM`:i===12?"12 PM":`${i-12} PM`}</option>)}</select></div>
            <div><div style={{color:"#374151",fontSize:10,marginBottom:4}}>MIN</div><select value={mn} onChange={e=>setMn(+e.target.value)} style={sel}>{[0,5,10,15,20,25,30,35,40,45,50,55].map(m=><option key={m} value={m}>{m.toString().padStart(2,"0")}</option>)}</select></div>
            <div style={{marginLeft:"auto",background:sp.alt>0?"#431407":"#111827",borderRadius:10,padding:"10px 14px",textAlign:"center",border:`1px solid ${sp.alt>0?"#9a3412":"#1e2d47"}`,minWidth:105}}>
              <div style={{fontSize:22}}>{sp.alt>0?"&#9728;":"&#127769;"}</div>
              <div style={{color:"#e2e8f0",fontSize:13,fontWeight:700}}>{fmt(hr,mn)}</div>
              {sp.alt>0?<><div style={{color:"#fb923c",fontSize:11}}>Alt: {Math.round(sp.alt)}&#176;</div><div style={{color:"#fb923c",fontSize:11}}>Az: {Math.round(sp.az)}&#176; {dStr(sp.az)}</div></>:<div style={{color:"#374151",fontSize:11}}>Sun below horizon</div>}
            </div>
          </div>
        </div>
        <div style={{display:"flex",gap:20,flexWrap:"wrap"}}>
          <div style={{flex:"1 1 410px"}}>
            <div style={{background:"#111827",borderRadius:12,padding:16,border:"1px solid #1e2d47"}}>
              <div style={{color:"#374151",fontSize:11,fontWeight:700,letterSpacing:1,marginBottom:12}}>SUN EXPOSURE MAP &#8212; {MN[mo-1]} {dy}, {yr} at {fmt(hr,mn)}</div>
              <div style={{display:"flex",justifyContent:"center"}}><Diagram park={park} sun={sp} size={385}/></div>
              <div style={{display:"flex",gap:8,flexWrap:"wrap",marginTop:12}}>
                {[0.05,0.20,0.38,0.54,0.70,0.88].map((v,i)=>{const c=iColor(v);return<div key={i} style={{display:"flex",alignItems:"center",gap:5}}><div style={{width:14,height:14,borderRadius:4,background:c.bg,border:`1px solid ${c.bdr}`}}/><span style={{fontSize:10,color:"#4b5563"}}>{c.s}</span></div>;})}
              </div>
              <div style={{color:"#1f2937",fontSize:10,marginTop:8}}>CF at top &middot; Rings = Field / Club / Upper deck &middot; Sun shown outside ring</div>
            </div>
          </div>
          <div style={{flex:"1 1 270px"}}>
            <div style={{color:"#374151",fontSize:11,fontWeight:700,letterSpacing:1,marginBottom:8}}>SEAT RECOMMENDATIONS</div>
            <Recs park={park} sun={sp}/>
            <div style={{background:"#111827",borderRadius:12,padding:14,marginTop:14,border:"1px solid #1e2d47"}}>
              <div style={{color:"#38bdf8",fontSize:13,fontWeight:600,marginBottom:10}}>Quick Tips</div>
              {[["Evening games (7pm+) = natural shade on one full side as sun moves west."],["April &amp; Sept: lower sun arc means more sections naturally shaded."],["Upper deck overhangs shield Field &amp; Club levels below on sun-facing sides."],["CF faces "+park.cfAz+"&#176; ("+dStr(park.cfAz)+") &#8212; anchor of all shade patterns."]].map((t,i)=>(
                <div key={i} style={{display:"flex",gap:8,marginBottom:8}}>
                  <span style={{color:"#1d4ed8",flexShrink:0}}>{["&#127749;","&#128197;","&#127913;","&#129517;"][i]}</span>
                  <span style={{color:"#4b5563",fontSize:12,lineHeight:1.5}} dangerouslySetInnerHTML={{__html:t[0]}}/>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ── STADIUM CARD ──────────────────────────────────────────────
function SCard({park,visited,onToggle,onSel}){
  return(
    <div className="scard" onClick={()=>onSel(park)}
      style={{background:visited?"#0b1f3a":"#0f1929",border:`1px solid ${visited?"#1d4ed8":"#1a2540"}`,borderRadius:9,padding:"10px 12px",cursor:"pointer"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
        <div style={{flex:1,minWidth:0}}>
          <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:3}}>
            <div style={{width:9,height:9,borderRadius:"50%",background:park.c1,flexShrink:0,border:`2px solid ${park.c2}`}}/>
            <span style={{color:"#e2e8f0",fontSize:13,fontWeight:600}}>{park.abbr}</span>
          </div>
          <div style={{color:"#4b5563",fontSize:11,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{park.name}</div>
          <div style={{color:"#1f2937",fontSize:10,marginTop:1}}>{park.city}</div>
          <span style={{fontSize:9,background:"#070d18",color:"#374151",padding:"2px 5px",borderRadius:4,display:"inline-block",marginTop:4}}>{park.roof==="dome"?"Dome":park.roof==="retractable"?"Retract.":"Open"}</span>
        </div>
        <button onClick={e=>{e.stopPropagation();onToggle(park.id);}}
          style={{width:24,height:24,borderRadius:6,border:`2px solid ${visited?"#2563eb":"#1a2540"}`,background:visited?"#2563eb":"transparent",color:"white",cursor:"pointer",fontSize:12,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,marginLeft:8}}>
          {visited?"&#10003;":""}
        </button>
      </div>
    </div>
  );
}

// ── MAIN APP ──────────────────────────────────────────────────
function App(){
  const [visited,setVisited]=useState(new Set());
  const [selected,setSelected]=useState(PARKS.find(p=>p.abbr==="LAD"));
  const [showDet,setShowDet]=useState(true);
  const [search,setSearch]=useState("");
  const [fDiv,setFDiv]=useState("All");
  const toggle=useCallback(id=>setVisited(p=>{const n=new Set(p);n.has(id)?n.delete(id):n.add(id);return n;}),[]);
  const sel=useCallback(p=>{setSelected(p);setShowDet(true);},[]);
  const filtered=PARKS.filter(p=>{const q=search.toLowerCase();return(p.team.toLowerCase().includes(q)||p.name.toLowerCase().includes(q)||p.city.toLowerCase().includes(q)||p.abbr.toLowerCase().includes(q))&&(fDiv==="All"||p.div===fDiv);});
  const pct=Math.round((visited.size/30)*100);
  const ss={background:"#070d18",color:"white",border:"1px solid #1a2540",borderRadius:8,padding:"6px 8px",fontSize:11,width:"100%",marginTop:6};
  return(
    <div style={{fontFamily:"system-ui,-apple-system,sans-serif",background:"#0a0f1e",height:"100vh",display:"flex",flexDirection:"column",overflow:"hidden"}}>
      <div style={{background:"#050a14",borderBottom:"1px solid #0f1929",padding:"10px 18px",display:"flex",alignItems:"center",gap:14,flexShrink:0}}>
        <span style={{fontSize:20}}>&#9918;</span>
        <div>
          <div style={{fontWeight:700,fontSize:16,color:"#f1f5f9"}}>MLB Stadium Sun Tracker</div>
          <div style={{fontSize:10,color:"#1f2937"}}>Find the perfect shaded seat at all 30 ballparks</div>
        </div>
        <div style={{marginLeft:"auto",textAlign:"right"}}>
          <div style={{color:"#6b7280",fontSize:12,fontWeight:600}}>{visited.size} / 30 Visited</div>
          <div style={{width:110,height:4,background:"#111827",borderRadius:2,marginTop:5,overflow:"hidden"}}>
            <div style={{height:"100%",width:`${pct}%`,background:"linear-gradient(90deg,#0096c7,#38bdf8)",borderRadius:2,transition:"width 0.3s"}}/>
          </div>
        </div>
      </div>
      <div style={{display:"flex",flex:1,overflow:"hidden"}}>
        <div style={{width:228,background:"#07101f",borderRight:"1px solid #0f1929",display:"flex",flexDirection:"column",flexShrink:0,overflow:"hidden"}}>
          <div style={{padding:"12px 10px",borderBottom:"1px solid #0f1929",flexShrink:0}}>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search teams or cities..."
              style={{width:"100%",background:"#0f1929",border:"1px solid #1a2540",borderRadius:8,padding:"7px 10px",color:"white",fontSize:12,boxSizing:"border-box"}}/>
            <select value={fDiv} onChange={e=>setFDiv(e.target.value)} style={ss}>
              <option value="All">All Divisions</option>
              {DIVS.map(d=><option key={d} value={d}>{d}</option>)}
            </select>
            <div style={{color:"#1a2540",fontSize:9,marginTop:7,lineHeight:1.5}}>Click checkmark to mark visited &middot; click card to open sun map</div>
          </div>
          <div style={{overflowY:"auto",flex:1,padding:"8px 8px"}}>
            {DIVS.filter(d=>fDiv==="All"||fDiv===d).map(div=>{
              const ds=filtered.filter(p=>p.div===div);
              if(!ds.length)return null;
              return<div key={div} style={{marginBottom:14}}>
                <div style={{color:"#1a2540",fontSize:9,fontWeight:700,letterSpacing:1,marginBottom:5,paddingLeft:3}}>{div}</div>
                <div style={{display:"flex",flexDirection:"column",gap:5}}>
                  {ds.map(p=><SCard key={p.id} park={p} visited={visited.has(p.id)} onToggle={toggle} onSel={sel}/>)}
                </div>
              </div>;
            })}
          </div>
        </div>
        <div style={{flex:1,overflowY:"auto"}}>
          {showDet&&selected?<Detail park={selected} onBack={()=>setShowDet(false)}/>
            :<div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100%"}}>
               <div style={{fontSize:54,marginBottom:14}}>&#9918;</div>
               <div style={{fontSize:17,fontWeight:600,color:"#1f2937"}}>Select a Stadium</div>
             </div>}
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
